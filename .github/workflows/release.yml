name: Build & Release Firmware

on:
  push:
    branches:
      - main
    # Só gera release (e OTA, que reinicia os dispositivos) quando muda algo do firmware
    paths:
      - "src/**"
      - "web/**"
      - "certs/**"
      - "scripts/**"
      - "partitions/**"
      - "platformio.ini"
      - ".github/workflows/release.yml"

# Uma release por vez, na ordem dos pushes: se duas rodassem em paralelo, a mais
# antiga poderia terminar por último, virar a "latest" e os aparelhos voltariam
# para a versão anterior
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  release:
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Instalar GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: "5.x"

      - name: Executar GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Substituir token de versão no FirmwareController
        run: |
          VERSION=${{ steps.gitversion.outputs.semVer }}
          echo "🔁 Substituindo versão para $VERSION"
          sed -i "s|#{Deploy_Version}#|$VERSION|" src/FirmwareController.h

      - name: Verificar versão inserida no código
        run: grep firmwareVersion src/FirmwareController.h

      - name: Compilar firmware
        run: pio run

      - name: Renomear firmware final
        run: |
          mkdir firmware
          cp .pio/build/esp32dev/firmware.bin firmware/retrorelay-${{ steps.gitversion.outputs.semVer }}.bin

      # Assinatura obrigatória: aparelhos que já exigem assinatura descartariam uma
      # versão sem .sig, então sem o secret a release não é publicada
      - name: Assinar firmware
        env:
          OTA_CHAVE_PRIVADA: ${{ secrets.OTA_CHAVE_PRIVADA }}
        run: |
          if [ -z "$OTA_CHAVE_PRIVADA" ]; then
            echo "::error::Secret OTA_CHAVE_PRIVADA não cadastrado: a release não será publicada sem assinatura"
            exit 1
          fi
          BIN=firmware/retrorelay-${{ steps.gitversion.outputs.semVer }}.bin
          CHAVE="$RUNNER_TEMP/chave.pem"
          umask 077
          printf '%s\n' "$OTA_CHAVE_PRIVADA" > "$CHAVE"
          openssl dgst -sha256 -sign "$CHAVE" -out "$BIN.sig" "$BIN"
          rm -f "$CHAVE"
          # A chave do secret precisa ser uma das embutidas no firmware: senão os
          # aparelhos recusariam esta versão quando a assinatura for obrigatória
          openssl dgst -sha256 -verify certs/ota_principal.pub.pem -signature "$BIN.sig" "$BIN" \
            || openssl dgst -sha256 -verify certs/ota_reserva.pub.pem -signature "$BIN.sig" "$BIN"

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.gitversion.outputs.semVer }}
          # A tag aponta para o commit compilado, não para o topo da main na hora de publicar
          target_commitish: ${{ github.sha }}
          # Toda versão nasce beta (só aparelhos no canal beta recebem). Para clientes,
          # promover com o workflow "Promover versão para estável". "[estavel]" na
          # mensagem do commit publica direto como estável (exceção, ex.: transição)
          prerelease: ${{ !contains(github.event.head_commit.message, '[estavel]') }}
          # .bin primeiro: aparelhos até a 1.8.0 baixam o primeiro arquivo da release
          files: |
            firmware/*.bin
            firmware/*.bin.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
