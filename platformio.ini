; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions/default_ota.csv
extra_scripts = pre:scripts/embed_web.py
board_build.embed_files = certs/x509_crt_bundle.bin
; Chaves públicas que o OTA aceita na assinatura do firmware (terminadas em zero)
board_build.embed_txtfiles =
	certs/ota_principal.pub.pem
	certs/ota_reserva.pub.pem
build_flags = 
	-DASYNC_OTA_ENABLED
lib_deps = 
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
	https://github.com/alanswx/ESPAsyncWiFiManager.git#3b9a58a031d32da908e205d60c7c58eedc8bd6ee
	bblanchon/ArduinoJson@7.4.3

; Testes da lógica (src/logica) no computador, sem placa: pio test -e native
[env:native]
platform = native
test_framework = unity
; mbedTLS do sistema (apt install libmbedtls-dev): mesma versão 2.28 do ESP32
build_flags = -std=gnu++17 -Isrc -lmbedcrypto
lib_deps =
	bblanchon/ArduinoJson@7.4.3
