name: Testes

# Roda em todo push e pull request, e é chamado pelo release.yml antes de
# publicar uma versão: nenhuma release sai sem os testes passarem.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  testes:
    # 24.04 fixo: traz o mbedTLS 2.28, a mesma versão do ESP32 (usada nos testes de assinatura)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Instalar mbedTLS (testes de assinatura do firmware)
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev

      - name: Instalar PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Testes da lógica do firmware (relés, cadastro, OTA, WiFi)
        run: pio test -e native

      - name: Testes do pacote de certificados do OTA
        run: python -m unittest discover -s scripts/tests -v

      - name: Sintaxe do JavaScript das páginas
        run: node scripts/checar_web.js web/index.html docs/index.html

      - name: Compilar firmware
        run: pio run -e esp32dev
