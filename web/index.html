  Interface web do Retro Relay, servida pelo próprio ESP32.
  Visual baseado no Modo Campanha (eduardoarine.github.io/modo-campanha):
  fundo tinta, texto creme, destaque laranja, cantos retos e fonte pixel.
  Este arquivo é comprimido e embutido no firmware por scripts/embed_web.py,
  então chega ao dispositivo junto com cada atualização OTA.
  Sem dependências externas: só as imagens dos consoles vêm do CDN.
-->

:root {
  --bg: #14110f;
  --superficie: #1d1815;
  --painel: #231f1c;
  --elevado: #2b2521;
  --texto: #f3e9d2;
  --texto-2: #d7cbb5;
  --apagado: #a89a86;
  --borda: rgba(243, 233, 210, .12);
  --borda-forte: rgba(243, 233, 210, .4);
  --hover: rgba(243, 233, 210, .06);
  --destaque: #f28c28;
  --destaque-claro: #ffb357;
  --destaque-escuro: #c96a1b;
  --brilho: rgba(242, 140, 40, .24);
  --tinta: #14110f;
  --ok: #7fb069;
  --perigo: #c44536;
  --perigo-texto: #e07a5f;
  --aviso: #f2c14e;
  --pixel: "Pixelify Sans", ui-monospace, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--texto);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--destaque-claro); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: currentColor; flex: none; shape-rendering: crispEdges; }

/* Cabeçalho */
header {
  display: flex; align-items: center; gap: 10px;
  min-height: 60px;
  padding: env(safe-area-inset-top) 16px 0;
  border-bottom: 1px solid var(--borda);
  background: var(--bg);
}
.marca {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--destaque); color: var(--tinta);
  border-radius: 4px;
  flex: none;
}
header h1 {
  flex: 1; min-width: 0; margin: 0;
  font: 500 20px/1 var(--pixel); letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
header h1.inicio { color: var(--destaque); }
header .voltar { margin-left: -10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--destaque-escuro);
  border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .1em;
  color: var(--ok);
  flex: none;
}
.led { width: 8px; height: 8px; background: #3a332d; flex: none; }
.chip .led { background: currentColor; }
body.offline .chip { color: var(--perigo-texto); border-color: var(--perigo); }

main { flex: 1; overflow-y: auto; }
.conteudo { max-width: 960px; margin: 0 auto; padding: 0 16px 24px; }

/* Avisos (sem conexão, atualização pendente) */
.aviso {
  margin: 12px 16px 0;
  padding: 12px 14px;
  background: var(--painel);
  border-left: 3px solid var(--aviso);
  border-radius: 4px;
  color: var(--texto-2);
  font-size: 14px;
}
.aviso b { color: var(--texto); display: block; }
#offline { border-left-color: var(--perigo); }
body:not(.offline) #offline { display: none; }
/* Sem conexão o toque não chegaria ao aparelho: os controles ficam apagados */
body.offline .agora, body.offline .grid { opacity: .45; pointer-events: none; }
.conteudo .aviso { margin: 16px 0 0; }

/* Textos */
.rotulo {
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--destaque);
}
.titulo-secao { margin: 24px 0 10px; }
.sub { color: var(--apagado); font-size: 14px; }

/* Botões */
.btn {
  height: 44px; padding: 0 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 4px;
  font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--texto);
  transition: background .15s, border-color .15s, color .15s;
}
.btn.primario { background: var(--destaque); color: var(--tinta); }
.btn.primario:hover { background: var(--destaque-claro); }
.btn.primario:active { background: var(--destaque-escuro); }
.btn.sec { border-color: var(--borda-forte); }
.btn.sec:hover { background: var(--hover); }
.btn.perigo { border-color: rgba(196, 69, 54, .7); color: var(--perigo-texto); }
.btn.perigo:hover { background: rgba(196, 69, 54, .12); }
.btn.perigo-cheio { background: var(--perigo); color: var(--texto); }
.btn.pequeno { height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled { background: rgba(243, 233, 210, .04); border-color: var(--borda); color: var(--apagado); cursor: default; }
.btn svg { width: 16px; height: 16px; }
.icone-btn {
  width: 44px; height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--texto-2);
  flex: none;
}
.icone-btn:hover { background: var(--hover); }
.icone-btn.perigo { color: var(--perigo-texto); }

/* Painel "ligado agora" */
.agora {
  margin-top: 16px;
  padding: 16px;
  background: var(--superficie);
  border: 1px solid var(--destaque-escuro);
  border-radius: 4px;
}
.agora-linha { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.agora-nome {
  flex: 1; min-width: 0;
  font: 500 22px/1.2 var(--pixel);
  color: var(--destaque);
  overflow-wrap: anywhere;
}
.agora-nome.nenhum { color: var(--apagado); }
.agora .sub { margin-top: 6px; }

/* Grade de consoles */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 16px;
}
@media (min-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}
.card {
  position: relative;
  aspect-ratio: .82;
  display: flex; flex-direction: column;
  padding: 10px;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 4px;
  text-align: left;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.card:hover { border-color: var(--borda-forte); }
.card.ativo {
  background: var(--painel);
  border-color: var(--destaque);
  box-shadow: 0 0 0 1px var(--destaque), 0 10px 28px -10px var(--brilho);
}
.ch { font: 500 12px/1 var(--pixel); letter-spacing: .08em; color: var(--apagado); }
.card.ativo .ch { color: var(--destaque); }
.card .img {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 4px;
}
/* Pixel art com fundo transparente: o halo claro destaca os consoles pretos no card escuro */
.card .img, .thumb, .imagens .foto { background: radial-gradient(closest-side, rgba(243, 233, 210, .1), transparent); }
.card.ativo .img { background: radial-gradient(closest-side, var(--brilho), transparent); }
.card .img img { height: 100%; max-width: 100%; aspect-ratio: 1; object-fit: contain; }
.card .img svg, .thumb svg { width: 40px; height: 40px; color: var(--borda-forte); }
.card .nome {

/* Interruptor */
.switch { position: relative; width: 48px; height: 28px; flex: none; }

<body>
<header>
  <button class="icone-btn voltar" id="voltar" hidden aria-label="Voltar"></button>
  <span class="marca" id="marca" aria-hidden="true"></span>
  <h1 id="titulo">Retro Relay</h1>
  <span class="chip" id="chip" role="status"><span class="led"></span><span id="chip-texto">Online</span></span>
</header>
<div class="aviso" id="offline" role="alert"><b>Sem conexão com o Retro Relay</b>Confira se o celular está no mesmo Wi-Fi. Tentando de novo…</div>
<main><div class="conteudo" id="view"></div></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>

<script>
'use strict';

// ─── Constantes (espelho de AppConstants do app) ──────────────────────────
const TOTAL_CANAIS = 16;
const POLL_MS = 5000;
const CDN = 'https://raw.githubusercontent.com/EduardoArine/retro-relay-images/refs/heads/main/';
const IMAGENS = [
  ['atari_2600', 'Atari 2600'], ['atari_7800', 'Atari 7800'], ['atari_jaguar', 'Jaguar'],
  ['odyssey_2', 'Odyssey²'], ['intellivision', 'Intellivision'], ['colecovision', 'ColecoVision'],
  ['nes', 'NES'], ['famicom', 'Famicom'], ['phantom_system', 'Phantom System'],
  ['snes', 'Super Nintendo'], ['super_famicom', 'Super Famicom'], ['n64', 'Nintendo 64'], ['game_cube', 'GameCube'],
  ['nintendo_wii', 'Wii'], ['nintendo_wii_u', 'Wii U'], ['nintendo_switch', 'Switch'], ['nintendo_switch_2', 'Switch 2'],
  ['master_system', 'Master System'], ['mega_drive', 'Mega Drive'], ['sega_cd', 'Sega CD'], ['sega_32x', '32X'], ['sega_saturn', 'Saturn'], ['sega_dreamcast', 'Dreamcast'],
  ['ps1', 'PlayStation'], ['ps2', 'PlayStation 2'], ['ps3', 'PlayStation 3'], ['ps4', 'PlayStation 4'], ['ps5', 'PlayStation 5'],
  ['xbox', 'Xbox'], ['xbox_360', 'Xbox 360'], ['xbox_one', 'Xbox One'], ['xbox_series_s', 'Xbox Series S'], ['xbox_series_x', 'Xbox Series X'],
  ['neogeo', 'Neo Geo'], ['neogeo_cd', 'Neo Geo CD'],
  ['pc_engine', 'PC Engine'], ['turbo_grafx', 'TurboGrafx-16'],
  ['3do', '3DO'], ['cdi', 'CD-i'],
  ['msx', 'MSX'], ['mister', 'MiSTer'], ['raspberry_pi', 'Raspberry Pi'],
].map(([arquivo, nome]) => ({ url: CDN + arquivo + '.png', nome }));
// O que mais costuma ficar ligado junto: telas, vídeo, áudio, jogos e ambiente
const ACESSORIOS = [
  ['tv_crt', 'TV de tubo'], ['tv_moderna', 'TV'], ['monitor_pvm', 'Monitor PVM'],
  ['upscaler', 'Upscaler'], ['chaveador_hdmi', 'Chaveador HDMI'], ['chaveador_av', 'Chaveador AV'],
  ['receiver', 'Receiver'], ['soundbar', 'Soundbar'], ['caixas_som', 'Caixas de som'],
  ['fliperama', 'Fliperama'], ['bartop', 'Bartop'], ['pc_gamer', 'PC gamer'], ['carregador_controles', 'Carregador de controles'],
  ['fita_led', 'Fita LED'], ['neon', 'Neon'], ['ventilador', 'Ventilador'],
].map(([arquivo, nome]) => ({ url: CDN + arquivo + '.png', nome }));

// ─── Ícones em pixel art 16×16 (cada '#' é um pixel aceso) ─────────────────
const PIXELS = {
  console: [
    '', '', '',
    '..############..',
    '.##############.',
    '###.########.###',
    '##...######.#.##',
    '###.########.###',
    '################',
    '#######..#######',
    '######....######',
    '#####......#####',
    '.###........###.',
  ],
  lista: [
    '', '',
    '.##.##########..',
    '.##.##########..',
    '', '',
    '.##.##########..',
    '.##.##########..',
    '', '',
    '.##.##########..',
    '.##.##########..',
  ],
  ajustes: [
    '',
    '......####......',
    '..##..####..##..',
    '..############..',
    '...##########...',
    '..#####..#####..',
    '######....######',
    '######....######',
    '######....######',
    '######....######',
    '..#####..#####..',
    '...##########...',
    '..############..',
    '..##..####..##..',
    '......####......',
  ],
  voltar: [
    '', '',
    '......##........',
    '.....##.........',
    '....##..........',
    '...##...........',
    '..############..',
    '..############..',
    '...##...........',
    '....##..........',
    '.....##.........',
    '......##........',
  ],
  editar: [
    '',
    '............##..',
    '...........####.',
    '............###.',
    '.........##..#..',
    '........####....',
    '.......#####....',
    '......#####.....',
    '.....#####......',
    '....#####.......',
    '....####........',
    '...#.##.........',
    '...##...........',
    '..#.............',
  ],
  remover: [
    '',
    '......####......',
    '..############..',
    '',
    '...##########...',
    '...##.#..#.##...',
    '...##.#..#.##...',
    '...##.#..#.##...',
    '...##.#..#.##...',
    '...##.#..#.##...',
    '...##.#..#.##...',
    '...##########...',
  ],
  mais: [
    '', '',
    '.......##.......',
    '.......##.......',
    '.......##.......',
    '.......##.......',
    '..############..',
    '..############..',
    '.......##.......',
    '.......##.......',
    '.......##.......',
    '.......##.......',
  ],
  atualizar: [
    '', '',
    '.....######.....',
    '...############.',
    '...###....####..',
    '..###......##...',
    '..##.......##...',
    '..##............',
    '..##............',
    '..##........##..',
    '..###......###..',
    '...###....###...',
    '...##########...',
    '.....######.....',
  ],
  energia: [
    '',
    '.......##.......',
    '...##..##..##...',
    '..##...##...##..',
    '.##....##....##.',
    '.##....##....##.',
    '##.....##.....##',
    '##............##',
    '##............##',
    '##............##',
    '.##..........##.',
    '.##..........##.',
    '..##........##..',
    '...##########...',
    '.....######.....',
  ],
  seta: [
    '', '', '', '', '',
    '..##........##..',
    '...##......##...',
    '....##....##....',
    '.....##..##.....',
    '......####......',
    '.......##.......',
  ],
};
function pixelIcone(linhas) {
  let d = '';
  linhas.forEach((linha, y) => linha.replace(/#+/g, (m, x) => (d += `M${x} ${y}h${m.length}v1h-${m.length}z`, m)));
  return `<path d="${d}"/>`;
}
const ICONES = Object.fromEntries(Object.entries(PIXELS).map(([nome, linhas]) => [nome, pixelIcone(linhas)]));
const ico = nome => `<svg viewBox="0 0 16 16" aria-hidden="true">${ICONES[nome]}</svg>`;

// ─── Estado ───────────────────────────────────────────────────────────────
const S = {
  estado: 0,          // bitmask dos 16 relés
  modo: 'unico',      // 'unico' | 'multi'
  versao: '',
  consoles: {},       // { canal: { nome, imagem } }
  conectado: true,
  carregado: false,
  pendentes: 0,       // toggles em andamento (pausa o polling do estado)
  diag: null,         // resposta do /diag (carregada ao abrir os Ajustes)
  diagAberto: false,  // detalhes técnicos expandidos
  atualizacao: '',    // versão nova esperando os consoles desligarem
  nome: '',           // nome único do aparelho (retrorelay-a3f2)
  reiniciando: '',    // rede do portal de configuração após um reset pela página
  canal: 'estavel',   // canal de atualização: 'estavel' | 'beta'
};

const ativo = i => (S.estado & (1 << i)) !== 0;
const ligados = () => [...Array(TOTAL_CANAIS).keys()].filter(ativo);
const $ = sel => document.querySelector(sel);
const ch = i => 'CH ' + String(i + 1).padStart(2, '0');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Só URLs http(s) viram <img>. Caminhos locais do celular (imagem própria no app) caem no ícone.
function imagemHtml(url, iconeFallback) {
  if (!/^https?:\/\//.test(url || '')) return iconeFallback;
  return `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML=ICONE_ERRO">`;
}
const ICONE_ERRO = ico('console');

// ─── API do ESP32 ─────────────────────────────────────────────────────────
async function api(caminho, opcoes = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch(caminho, { ...opcoes, signal: ctl.signal });
    if (!r.ok) throw new Error(await r.text() || r.status);
    return r;
  } finally {
    clearTimeout(t);
  }
}

function setConectado(ok) {
  if (S.conectado === ok) return;
  S.conectado = ok;
  document.body.classList.toggle('offline', !ok);
  $('#chip-texto').textContent = ok ? 'Online' : 'Offline';
  if (rota().tela === 'config') render();
}

async function atualizarEstado() {
  try {
    const d = await (await api('/estado')).json();
    setConectado(true);
    if (S.pendentes) return;
    // Firmware novo traz página nova: recarrega para não ficar com a antiga
    // (espera se a pessoa estiver digitando, para não perder o que escreveu)
    if (S.versao && d.versao !== S.versao) {
      if (!document.activeElement?.matches('input:not([type=checkbox]), textarea')) location.reload();
      return;
    }
    const atualizacao = d.atualizacao_pendente || '';
    const canal = d.canal || 'estavel';
    const mudou = d.estado !== S.estado || d.modo !== S.modo || d.versao !== S.versao || atualizacao !== S.atualizacao || (d.nome || '') !== S.nome || canal !== S.canal;
    S.estado = d.estado; S.modo = d.modo; S.versao = d.versao; S.atualizacao = atualizacao; S.nome = d.nome || ''; S.canal = canal;
    if (mudou && rota().tela !== 'canal') render();
  } catch {
    setConectado(false);
  }
}

async function carregarDiag() {
  try {
    S.diag = await (await api('/diag')).json();
  } catch {
    S.diag = null;
  }
  if (rota().tela === 'config') render();
}

async function carregarConsoles() {
  try {
    const lista = await (await api('/consoles')).json();
    S.consoles = {};
    for (const c of lista) S.consoles[c.canal] = { nome: c.nome, imagem: c.imagem || '' };
  } catch {
    toast('Não foi possível carregar os consoles');
  }
}

async function salvarConsoles(novos) {
  const lista = Object.keys(novos).map(Number).sort((a, b) => a - b)
    .map(canal => ({ canal, nome: novos[canal].nome, imagem: novos[canal].imagem }));
  await api('/consoles', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(lista),
  });
  S.consoles = novos;
}

// ─── Ações ────────────────────────────────────────────────────────────────
// Mesma regra do app: atualiza a tela na hora e confirma com o ESP depois.
async function alternar(i) {
  const bit = 1 << i;
  S.estado = S.modo === 'unico' ? (S.estado & bit ? 0 : bit) : S.estado ^ bit;
  render();
  S.pendentes++;
  try {
    await api('/ligar?canal=' + i);
  } catch {
    toast('Falha ao comunicar com o dispositivo');
  } finally {
    S.pendentes--;
    atualizarEstado();
  }
}

// /ligar alterna o canal, então cada passo confere o estado real antes: se o app
// mudar algo no meio, nada é religado por engano
async function desligarTudo() {
  S.estado = 0;
  render();
  S.pendentes++;
  try {
    for (let passo = 0; passo < TOTAL_CANAIS; passo++) {
      const { estado } = await (await api('/estado')).json();
      if (!estado) break;
      await api('/ligar?canal=' + (31 - Math.clz32(estado & -estado)));
    }
  } catch {
    toast('Falha ao comunicar com o dispositivo');
  } finally {
    S.pendentes--;
    atualizarEstado();
  }
}

async function alterarModo(unico) {
  try {
    await api('/modo?valor=' + (unico ? 'unico' : 'multi'));
    await atualizarEstado();
  } catch {
    toast('Falha ao alterar o modo');
    render();
  }
}

async function alterarCanal(beta) {
  try {
    await api('/canal?valor=' + (beta ? 'beta' : 'estavel'), { method: 'POST' });
    toast(beta ? 'Canal beta: recebe as versões novas assim que saírem'
               : 'Canal estável: recebe só as versões liberadas para clientes');
    await atualizarEstado();
    carregarDiag();
  } catch {
    toast('Falha ao alterar o canal');
    render();
  }
}

async function verificarAtualizacao(btn) {
  btn.disabled = true;
  try {
    toast(await (await api('/check-ota')).text());
  } catch {
    toast('Falha ao solicitar a verificação');
  }
  setTimeout(() => { btn.disabled = false; }, 10000);
}

// Rede aberta pelo aparelho para configurar o Wi-Fi: RetroRelay-A3F2
function nomePortal() {
  return 'RetroRelay-' + (S.nome.split('-')[1] || 'XXXX').toUpperCase();
}

const RESETS = {
  'esquecer-wifi': {
    titulo: 'Trocar rede Wi-Fi',
    texto: 'O Retro Relay vai esquecer o Wi-Fi atual e reiniciar. Os consoles cadastrados são mantidos.',
    botao: 'Trocar',
  },
  'restaurar-fabrica': {
    titulo: 'Restaurar padrões',
    texto: 'Apaga o Wi-Fi, todos os consoles cadastrados e o modo, e reinicia. Não dá para desfazer.',
    botao: 'Restaurar',
  },
};

function confirmarReset(acao) {
  const r = RESETS[acao];
  dialogo(r.titulo, esc(r.texto), r.botao, async () => {
    try {
      // Cabeçalho exigido pelo aparelho: impede que outros sites peçam o reset
      await api('/' + acao, { method: 'POST', headers: { 'X-Confirmar': 'sim' } });
      S.reiniciando = nomePortal();
      render();
    } catch (e) {
      toast(e.message);
    }
  });
}

function confirmarRemocao(i) {
  const c = S.consoles[i];
  dialogo('Remover console', `Remover "${esc(c.nome)}" do canal ${i + 1}?`, 'Remover', async () => {
    const novos = { ...S.consoles };
    delete novos[i];
    try {
      await salvarConsoles(novos);
      render();
    } catch (e) {
      toast('Falha ao remover: ' + e.message);
    }
  });
}

// ─── Componentes ──────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// Toda confirmação deste app é destrutiva: o botão de ação vem em vermelho
function dialogo(titulo, textoHtml, acao, aoConfirmar) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
    <h2 id="dialogo-titulo">${esc(titulo)}</h2><p>${textoHtml}</p>
    <div class="acoes"><button class="btn sec pequeno" data-r="0">Cancelar</button><button class="btn perigo-cheio pequeno" data-r="1">${esc(acao)}</button></div>
  </div>`;
  scrim.onclick = e => {
    const r = e.target.dataset.r;
    if (e.target !== scrim && r === undefined) return;
    scrim.remove();
    if (r === '1') aoConfirmar();
  };
  document.body.appendChild(scrim);
  scrim.querySelector('[data-r="0"]').focus();
}

function avisoAtualizacao() {
  return S.atualizacao
    ? `<div class="aviso" role="status"><b>Atualização ${esc(S.atualizacao)} pronta</b>Instala sozinha quando todos os consoles estiverem desligados.</div>`
    : '';
}

// ─── Telas ────────────────────────────────────────────────────────────────
function painelAgora() {
  const on = ligados();
  const nomes = on.map(i => S.consoles[i]?.nome || `Canal ${i + 1}`);
  const titulo = !on.length ? 'Nenhum console' : on.length === 1 ? nomes[0] : `${on.length} consoles`;
  const sub = S.modo === 'unico'
    ? 'Modo único: ligar um console desliga o outro'
    : 'Modo vários: os consoles podem ficar ligados juntos';
  return `<section class="agora" aria-live="polite">
    <div class="rotulo">Ligado agora</div>
    <div class="agora-linha">
      <div class="agora-nome${on.length ? '' : ' nenhum'}">${esc(titulo)}</div>
      ${on.length ? `<button class="btn sec pequeno" id="desligar">${ico('energia')}${on.length > 1 ? 'Desligar todos' : 'Desligar'}</button>` : ''}
    </div>
    <div class="sub">${sub}</div>
  </section>`;
}

function primeiroLivre() {
  for (let i = 0; i < TOTAL_CANAIS; i++) if (!S.consoles[i]) return i;
  return 0;
}

function telaHome() {
  const canais = Object.keys(S.consoles).map(Number).sort((a, b) => a - b);
  if (!canais.length) {
    if (!S.carregado) return '<div class="vazio">Carregando…</div>';
    return `<div class="vazio">${ico('console')}
      <h2>Nenhum console</h2>
      <p>Cadastre os consoles ligados ao Retro Relay para controlá-los por aqui.</p>
      <a class="btn primario" href="#canal/${primeiroLivre()}">${ico('mais')}Cadastrar console</a>
    </div>`;
  }
  return avisoAtualizacao() + painelAgora() + `<div class="grid">${canais.map(i => {
    const c = S.consoles[i];
    const on = ativo(i);
    return `<button class="card${on ? ' ativo' : ''}" data-canal="${i}" aria-pressed="${on}" aria-label="${esc(c.nome)}, ${on ? 'ligado' : 'desligado'}">
      <span class="ch">${ch(i)}</span>
      <div class="img">${imagemHtml(c.imagem, ico('console'))}</div>
      <div class="nome">${esc(c.nome)}</div>
      <span class="estado"><span class="led"></span>${on ? 'Ligado' : 'Desligado'}</span>
    </button>`;
  }).join('')}</div>`;
}

function telaCadastro() {
  const usados = [], livres = [];
  for (let i = 0; i < TOTAL_CANAIS; i++) (S.consoles[i] ? usados : livres).push(i);
  const lista = usados.length
    ? `<div class="lista">${usados.map(i => {
        const c = S.consoles[i];
        return `<div class="item" data-editar="${i}">
          <span class="ch">${ch(i)}</span>
          <div class="thumb">${imagemHtml(c.imagem, ico('console'))}</div>
          <div class="textos">${esc(c.nome)}</div>
          <button class="icone-btn" data-editar="${i}" title="Editar" aria-label="Editar ${esc(c.nome)}">${ico('editar')}</button>
          <button class="icone-btn perigo" data-remover="${i}" title="Remover" aria-label="Remover ${esc(c.nome)}">${ico('remover')}</button>
        </div>`;
      }).join('')}</div>`
    : '<p class="sub">Nenhum console cadastrado ainda. Escolha abaixo a saída do Retro Relay em que o console está ligado.</p>';
  return `<div class="rotulo titulo-secao">Consoles · ${usados.length} de ${TOTAL_CANAIS}</div>${lista}
    ${livres.length ? `<div class="rotulo titulo-secao">Canais livres</div>
    <div class="livres">${livres.map(i => `<button class="livre" data-editar="${i}" aria-label="Cadastrar no canal ${i + 1}">${ico('mais')}${ch(i)}</button>`).join('')}</div>` : ''}`;
}

function telaCanal(i) {
  const c = S.consoles[i] || { nome: '', imagem: '' };
  const botoes = opcoes => opcoes.map(o =>
    `<button type="button" data-img="${esc(o.url)}" data-nome="${o.url ? esc(o.nome) : ''}"${o.url === c.imagem ? ' class="sel"' : ''}>
      <span class="foto">${imagemHtml(o.url, ico('console'))}</span>${esc(o.nome)}</button>`
  ).join('');
  return `<form class="form" id="form-canal" autocomplete="off">
    <label class="rotulo" for="nome">Nome</label>
    <input id="nome" maxlength="32" placeholder="Ex: Super Nintendo" value="${esc(c.nome)}" autocapitalize="words">
    <div class="sub dica">Ligue o aparelho na saída ${i + 1} do Retro Relay.</div>
    <div class="rotulo titulo-secao">Imagem</div>
    <div id="imagens">
      <div class="grupo-imagens">Consoles</div>
      <div class="imagens">${botoes([{ url: '', nome: 'Sem imagem' }, ...IMAGENS])}</div>
      <div class="grupo-imagens">Acessórios e aparelhos</div>
      <div class="imagens">${botoes(ACESSORIOS)}</div>
    </div>
    <div class="salvar-barra"><button class="btn primario" id="salvar" type="submit"${c.nome.trim() ? '' : ' disabled'}>Salvar</button></div>
  </form>`;
}

function telaConfig() {
  const versao = !S.versao || S.versao.startsWith('#') ? 'desenvolvimento' : S.versao;
  return `
    <div class="rotulo titulo-secao">Aparelho</div>
    <div class="grupo">
      <div class="linha">
        <div class="textos">
          <div class="titulo">${S.nome ? esc(S.nome) : 'Retro Relay'}</div>
          <div class="sub">http://${esc(location.host)}</div>
        </div>
        <span class="estado" style="margin:0;color:${S.conectado ? 'var(--ok)' : 'var(--perigo-texto)'}"><span class="led" style="background:currentColor"></span>${S.conectado ? 'Conectado' : 'Sem conexão'}</span>
      </div>
      <label class="linha">
        <div class="textos">
          <div class="titulo">Modo único</div>
          <div class="sub">Ligar um console desliga o que estiver ligado</div>
        </div>
        <span class="switch"><input type="checkbox" id="modo"${S.modo === 'unico' ? ' checked' : ''}><span class="trilho"></span></span>
      </label>
    </div>

    <div class="rotulo titulo-secao">Atualizações</div>
    <div class="grupo">
      <div class="linha">
        <div class="textos">
          <div class="titulo">Versão ${esc(versao)}</div>
          ${S.atualizacao
            ? `<div class="nota">Versão ${esc(S.atualizacao)} será instalada quando os consoles forem desligados</div>`
            : '<div class="sub">Atualiza sozinho pela internet</div>'}
        </div>
        <button class="btn sec pequeno" id="ota">${ico('atualizar')}Verificar</button>
      </div>
      <label class="linha">
        <div class="textos">
          <div class="titulo">Versões beta</div>
          <div class="sub">Recebe versões novas antes dos clientes, para testar</div>
        </div>
        <span class="switch"><input type="checkbox" id="beta"${S.canal === 'beta' ? ' checked' : ''}><span class="trilho"></span></span>
      </label>
    </div>

    <div class="rotulo titulo-secao">Diagnóstico</div>
    <div class="grupo">
      <button class="btn abrir-diag" id="abrir-diag" aria-expanded="${S.diagAberto}">Detalhes técnicos${ico('seta')}</button>
      ${S.diagAberto ? diagHtml() : ''}
    </div>

    <div class="rotulo titulo-secao">Manutenção</div>
    <div class="grupo">
      <div class="linha">
        <div class="textos">
          <div class="titulo">Trocar rede Wi-Fi</div>
          <div class="sub">Esquece o Wi-Fi atual e abre a rede de configuração</div>
        </div>
        <button class="btn perigo pequeno" id="esquecer-wifi">Trocar</button>
      </div>
      <div class="linha">
        <div class="textos">
          <div class="titulo">Restaurar padrões</div>
          <div class="sub">Apaga Wi-Fi, consoles cadastrados e modo</div>
        </div>
        <button class="btn perigo pequeno" id="restaurar-fabrica">Restaurar</button>
      </div>
    </div>`;
}

function duracao(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}min` : `${m}min`;
}

const MOTIVOS_RESET = {
  energia: 'Ligado na tomada', software: 'Reinício pelo firmware', crash: 'Travamento (crash)',
  watchdog: 'Watchdog', queda_de_tensao: 'Queda de tensão', botao_reset: 'Botão reset', outro: 'Outro',
};
const MOTIVOS_REINICIO = {
  ota: 'Atualização de firmware', wifi_sem_conexao: 'Sem Wi-Fi por 5 min',
  wifi_nao_conectou_no_boot: 'Wi-Fi não conectou ao ligar',
  ota_sem_certificado: 'Atualização (certificado não verificado)',
  wifi_esquecido: 'Troca de rede Wi-Fi', restaurado_fabrica: 'Padrões de fábrica restaurados',
};
const CERTIFICADO_OTA = { ok: 'Verificado', falhou: 'Falhou (atualiza sem verificar)', nao_testado: 'Ainda não testado' };
const ASSINATURA_OTA = { valida: 'Válida', invalida: 'Inválida', sem_assinatura: 'Versão sem assinatura', nao_testado: 'Ainda não testada' };

// Dados do /diag para entender quando o dispositivo "some" da rede
function diagHtml() {
  const d = S.diag;
  if (!d) return '<div class="linha"><div class="sub">Indisponível</div></div>';
  const rssi = d.wifi.rssi;
  const sinal = rssi >= -60 ? 'bom' : rssi >= -72 ? 'regular' : 'fraco';
  const reinicio = d.reset === 'software' && d.ultimo_reinicio
    ? MOTIVOS_REINICIO[d.ultimo_reinicio] || d.ultimo_reinicio
    : MOTIVOS_RESET[d.reset] || d.reset;
  const itens = [
    ['Ligado há', duracao(d.ligado_ha_s)],
    ['Último reinício', reinicio],
    ['Sinal Wi-Fi', `${rssi} dBm (${sinal})`],
    ['Quedas de Wi-Fi', d.wifi.desconexoes + (d.wifi.ultimo_motivo ? ` (última: ${d.wifi.ultimo_motivo})` : '')],
    ['Reconexões forçadas', d.wifi.reconexoes_forcadas],
    ['Memória livre', `${Math.round(d.memoria.livre / 1024)} KB (mínima ${Math.round(d.memoria.minima / 1024)} KB)`],
    ['Certificado do OTA', (CERTIFICADO_OTA[d.ota?.certificado] || '—') + (d.ota?.exige_certificado ? ' · obrigatório' : '')],
    ['Assinatura do firmware', (ASSINATURA_OTA[d.ota?.assinatura] || '—') + (d.ota?.assinatura_versao ? ` (${d.ota.assinatura_versao})` : '') + (d.ota?.exige_assinatura ? ' · obrigatória' : '')],
    ['Canal de atualização', d.ota?.canal === 'beta' ? 'Beta' : `Estável · grupo ${d.ota?.grupo ?? '—'} (recebe com liberação acima de ${d.ota?.grupo ?? '—'}%)`],
  ];
  return `<dl class="diag">${itens.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

// ─── Rotas (hash) ─────────────────────────────────────────────────────────
// #home, #cadastro, #config, #canal/N
function rota() {
  const [tela, arg] = location.hash.slice(1).split('/');
  if (tela === 'canal' && +arg >= 0 && +arg < TOTAL_CANAIS) return { tela, canal: +arg };
  return { tela: ['cadastro', 'config'].includes(tela) ? tela : 'home' };
}

const ABAS = [
  { tela: 'home', rotulo: 'Consoles', icone: 'console' },
  { tela: 'cadastro', rotulo: 'Cadastro', icone: 'lista' },
  { tela: 'config', rotulo: 'Ajustes', icone: 'ajustes' },
];

function render() {
  if (S.reiniciando) {
    $('#titulo').textContent = 'Reiniciando';
    $('#voltar').hidden = true;
    $('#view').innerHTML = `<div class="vazio">${ico('ajustes')}
      <h2>Reiniciando</h2>
      <p>Para configurar o Wi-Fi, conecte o celular à rede <b>${esc(S.reiniciando)}</b> e siga as instruções que aparecerem.</p>
    </div>`;
    return;
  }

  const r = rota();
  const aba = r.tela === 'canal' ? 'cadastro' : r.tela;
  const titulos = { home: 'Retro Relay', cadastro: 'Cadastro', config: 'Ajustes', canal: `Canal ${r.canal + 1}` };

  $('#titulo').textContent = titulos[r.tela];
  $('#titulo').classList.toggle('inicio', r.tela === 'home');
  document.title = r.tela === 'home' ? 'Retro Relay' : titulos[r.tela] + ' · Retro Relay';
  $('#voltar').hidden = r.tela !== 'canal';
  $('#marca').hidden = r.tela === 'canal';

  $('#nav').innerHTML = ABAS.map(a => `<a href="#${a.tela}"${a.tela === aba ? ' class="sel" aria-current="page"' : ''}>
    ${ico(a.icone)}${a.rotulo}</a>`).join('');

  const telas = { home: telaHome, cadastro: telaCadastro, config: telaConfig, canal: () => telaCanal(r.canal) };
  $('#view').innerHTML = telas[r.tela]();
  if (r.tela === 'canal') ligarFormCanal(r.canal);
}

function ligarFormCanal(i) {
  const form = $('#form-canal'), nome = $('#nome'), salvar = $('#salvar');
  let imagem = (S.consoles[i] || {}).imagem || '';
  // Nome sugerido pela imagem escolhida: troca junto com a imagem enquanto
  // a pessoa não escrever outro
  let sugerido = ([...IMAGENS, ...ACESSORIOS].find(o => o.url === imagem) || {}).nome || '';

  nome.oninput = () => { salvar.disabled = !nome.value.trim(); };
  $('#imagens').onclick = e => {
    const b = e.target.closest('[data-img]');
    if (!b) return;
    imagem = b.dataset.img;
    form.querySelectorAll('[data-img]').forEach(x => x.classList.toggle('sel', x === b));
    if (b.dataset.nome && (!nome.value.trim() || nome.value === sugerido)) {
      nome.value = b.dataset.nome;
      salvar.disabled = false;
    }
    sugerido = b.dataset.nome;
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const n = nome.value.trim();
    if (!n) return;
    salvar.disabled = true;
    try {
      await salvarConsoles({ ...S.consoles, [i]: { nome: n, imagem } });
      voltar();
    } catch (err) {
      toast('Falha ao salvar: ' + err.message);
      salvar.disabled = false;
    }
  };
  const sel = form.querySelector('.sel');
  if (sel && imagem) sel.scrollIntoView({ block: 'nearest' });
}

// ─── Eventos ──────────────────────────────────────────────────────────────
// Volta pelo histórico só se a navegação começou dentro da página
// (quem abriu #canal/N direto pela URL sairia da página com history.back)
let navegouAqui = false;
function voltar() {
  if (navegouAqui) history.back();
  else location.replace('#cadastro');
}
$('#voltar').innerHTML = ico('voltar');
$('#voltar').onclick = voltar;
$('#marca').innerHTML = ico('console');

$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-canal],[data-editar],[data-remover],#ota,#desligar,#abrir-diag,#esquecer-wifi,#restaurar-fabrica');
  if (!t) return;
  if (t.dataset.canal !== undefined) alternar(+t.dataset.canal);
  else if (t.dataset.remover !== undefined) { e.stopPropagation(); confirmarRemocao(+t.dataset.remover); }
  else if (t.dataset.editar !== undefined) location.hash = '#canal/' + t.dataset.editar;
  else if (t.id === 'ota') verificarAtualizacao(t);
  else if (t.id === 'desligar') desligarTudo();
  else if (t.id === 'abrir-diag') { S.diagAberto = !S.diagAberto; render(); }
  else if (RESETS[t.id]) confirmarReset(t.id);
});

$('#view').addEventListener('change', e => {
  if (e.target.id === 'modo') alterarModo(e.target.checked);
  if (e.target.id === 'beta') alterarCanal(e.target.checked);
});

window.addEventListener('hashchange', () => {
  navegouAqui = true;
  render();
  $('main').scrollTop = 0;
  if (rota().tela === 'config') carregarDiag();
});

// Polling: sincroniza com mudanças feitas pelo app e detecta queda de conexão
setInterval(() => { if (!document.hidden) atualizarEstado(); }, POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { atualizarEstado(); carregarConsoles().then(() => { if (rota().tela !== 'canal') render(); }); }
});

render();
Promise.all([carregarConsoles(), atualizarEstado()]).then(() => {
  S.carregado = true;
  render();
});
if (rota().tela === 'config') carregarDiag();
</script>
</body>
</html>
